name: Empirical certification

on:
  pull_request:
    paths:
      - 'docs/EMPIRICAL_FINDINGS_2026-09-10.md'
      - 'docs/EMPIRICAL_CERTIFICATION_RECONCILIATION_2026-09-10.md'
      - 'docs/BPS_CROSSWAVE_CERTIFICATION_2026-09-10.md'
      - 'docs/BLIBLI_VINTAGE_SENSITIVITY_2026-09-10.md'
      - 'docs/KONG_EMPIRICAL_DECISION_SHEET_2026-09-10.md'
      - 'data/longitudinal/kong_empirical_candidate_table_2026-09-10.csv'
      - 'data/longitudinal/certified_indonesia_evidence_status_2026-09-10.csv'
      - 'data/longitudinal/blibli_vintage_sensitivity_2026-09-10.csv'
      - 'data/bps_official/bps_certification_status_2026-09-10.csv'
      - 'data/global_ecommerce/global_platform_summary.csv'
      - 'scripts/analysis/validate_empirical_certification.py'
      - '.github/workflows/empirical-certification.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate certified findings and counts
        run: |
          python3 -m py_compile scripts/analysis/validate_empirical_certification.py
          python3 scripts/analysis/validate_empirical_certification.py
