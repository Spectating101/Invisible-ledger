name: Freeze proposal Chapters 1 and 2

on:
  push:
    branches: [ch12-freeze-transfer]
    paths:
      - .github/workflows/freeze-proposal-ch12.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ch12-freeze-transfer
          fetch-depth: 0

      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-liberation fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install python-docx

      - name: Preserve Chapter 3 onward baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/current/Invisible_Ledger_Thesis_Proposal_CANONICAL_TEXT.md')
          text=p.read_text(encoding='utf-8')
          marker='\n## 3. Theoretical Framework and Key Variables\n'
          assert marker in text
          Path('/tmp/ch3plus.txt').write_text(marker + text.split(marker,1)[1], encoding='utf-8')
          PY

      - name: Apply frozen Chapters 1 and 2
        run: python scripts/freeze_proposal_chapters_1_2.py

      - name: Reapply canonical typography
        run: python scripts/finalize_proposal_format.py papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx

      - name: Render canonical PDF
        run: |
          rm -f papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.pdf
          libreoffice --headless --convert-to pdf --outdir papers/current papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx

      - name: Regenerate searchable mirror
        run: python scripts/export_canonical_proposal_text.py

      - name: Verify freeze
        run: |
          unzip -t papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from zipfile import ZipFile
          import re, subprocess

          docx=Path('papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx')
          pdf=Path('papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.pdf')
          mirror=Path('papers/current/Invisible_Ledger_Thesis_Proposal_CANONICAL_TEXT.md')
          doc=Document(docx)
          assert len(doc.tables)==7, len(doc.tables)
          refs=[p.text.strip() for p in doc.paragraphs if p.style.name=='Reference' and p.text.strip()]
          assert len(refs)==31, len(refs)
          pages=int(subprocess.check_output(['pdfinfo',str(pdf)],text=True).split('Pages:')[1].splitlines()[0].strip())
          assert pages==11, pages
          text=mirror.read_text(encoding='utf-8')
          assert 'How much economic activity remains invisible when digital platforms are measured through their reported revenue?' in text
          assert 'Digital platforms sit between economic activity and the records used to measure it.' in text
          assert '### 2.2 Digital Records and Third-Party Information' in text
          assert 'How large is the gap between the commerce Indonesian platforms carry' not in text
          marker='\n## 3. Theoretical Framework and Key Variables\n'
          after=marker + text.split(marker,1)[1]
          before=Path('/tmp/ch3plus.txt').read_text(encoding='utf-8')
          assert after==before, 'Chapter 3 onward changed during Chapter 1-2 freeze'
          shape=doc.inline_shapes[0]
          from docx.oxml.ns import qn
          blip=shape._inline.graphic.graphicData.pic.blipFill.blip
          img=doc.part.related_parts[blip.embed].image
          assert abs(shape.width/shape.height-img.px_width/img.px_height)<0.01
          with ZipFile(docx) as z:
              assert not any('comment' in n.lower() or 'people' in n.lower() for n in z.namelist())
              pats=[re.compile(r'<w:'+k+r'(?:\s|>)') for k in ('ins','del','moveFrom','moveTo')]
              for name in z.namelist():
                  if name.endswith('.xml'):
                      xml=z.read(name).decode('utf-8','ignore')
                      assert not any(p.search(xml) for p in pats), name
          print('QA: Chapters 1-2 frozen; Chapter 3 onward byte-identical in searchable text; 11 pages; 7 tables; 31 references; figure ratio valid; no comments/tracked changes')
          PY

      - name: Commit verified artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx \
                  papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.pdf \
                  papers/current/Invisible_Ledger_Thesis_Proposal_CANONICAL_TEXT.md
          git commit -m "Build verified Chapter 1-2 proposal freeze"
          git push origin HEAD:ch12-freeze-transfer
