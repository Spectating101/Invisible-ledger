name: Render current proposal
on:
  push:
    branches:
      - render/current-proposal-c788ba0
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render exact current proposal
        run: |
          mkdir -p rendered
          pdftoppm -png -r 140 papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.pdf rendered/page
          ls -lh rendered
      - uses: actions/upload-artifact@v4
        with:
          name: current-proposal-pages-c788ba0
          path: rendered/*.png
          if-no-files-found: error
