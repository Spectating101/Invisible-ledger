name: Verify current thesis artifacts

on:
  push:
    branches: [main, proposal/integrated-2026-09-16]
    paths:
      - papers/current/Invisible_Ledger_Proposal_FINAL_2026-09-27.pdf
      - papers/current/Invisible_Ledger_Thesis_Proposal_CANONICAL_TEXT.md
      - papers/current/IL_Proposal_Oral_Deck_v4.10_Christopher_Ongko.pptx
      - papers/current/IL_Proposal_Oral_Deck_v4.10_Christopher_Ongko_preview.pdf
      - scripts/export_canonical_proposal_text.py
      - scripts/validate_current_artifacts.py
      - .github/workflows/verify-current-artifacts.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Check active files and hashes
        run: python scripts/validate_current_artifacts.py
