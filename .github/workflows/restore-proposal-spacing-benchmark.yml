name: Start proposal references on page 9
on:
  push:
    branches: [fix/restore-proposal-spacing-benchmark-20260915]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          pip install python-docx
      - name: Force References to a fresh page
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "40f6e4492b2a288b84166c280624f481e14ff2f8"
          git checkout -B main origin/main
          python - <<'PY'
          from docx import Document
          from zipfile import ZipFile
          import hashlib

          path='papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx'
          doc=Document(path)
          before_text=[p.text for p in doc.paragraphs]
          before_tables=[[c.text for r in t.rows for c in r.cells] for t in doc.tables]
          with ZipFile(path) as z:
              before_media={n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if n.startswith('word/media/')}

          refs=next(p for p in doc.paragraphs if p.text.strip()=='References')
          refs.paragraph_format.page_break_before=True
          doc.save(path)

          after=Document(path)
          assert [p.text for p in after.paragraphs]==before_text
          assert [[c.text for r in t.rows for c in r.cells] for t in after.tables]==before_tables
          assert len(after.tables)==7
          assert len(after.inline_shapes)==1
          shape=after.inline_shapes[0]
          assert abs(shape.width/shape.height - 2.74584) < 0.001
          assert abs(shape.width/360000 - 16.8346) < 0.02
          assert next(p for p in after.paragraphs if p.text.strip()=='References').paragraph_format.page_break_before is True
          with ZipFile(path) as z:
              after_media={n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if n.startswith('word/media/')}
          assert after_media==before_media
          print('Document content preserved; References page break set.')
          PY
      - name: Render PDF and release gates
        run: |
          rm -f papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.pdf
          libreoffice --headless --convert-to pdf --outdir papers/current papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx
          PDF=papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.pdf
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" = "9"
          ! pdftotext -f 8 -l 8 "$PDF" - | grep -Fxq 'References'
          pdftotext -f 9 -l 9 "$PDF" - | grep -Fxq 'References'
          python - <<'PY'
          from docx import Document
          from zipfile import ZipFile
          import re
          p='papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx'
          d=Document(p)
          idx=next(i for i,x in enumerate(d.paragraphs) if x.text.strip()=='References')
          refs=[x.text.strip() for x in d.paragraphs[idx+1:] if x.text.strip()]
          assert len(refs)==31
          assert len(d.tables)==7
          with ZipFile(p) as z:
              assert not any('comment' in n.lower() or 'people' in n.lower() for n in z.namelist())
              pats=[re.compile(r'<w:'+k+r'(?:\s|>)') for k in ('ins','del','moveFrom','moveTo')]
              for n in z.namelist():
                  if n.endswith('.xml'):
                      x=z.read(n).decode('utf-8','ignore')
                      assert not any(q.search(x) for q in pats), n
          print('QA: 9 pages; References starts on page 9; 7 tables; 31 references; clean review state.')
          PY
      - name: Commit proposal layout to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.docx papers/current/Invisible_Ledger_Thesis_Proposal_FINAL_2026-09-14.pdf
          git commit -m "Start proposal references on a fresh page"
          git push origin main
