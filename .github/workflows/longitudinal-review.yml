name: Longitudinal data review
on:
  pull_request:
    paths:
      - 'data/longitudinal/**'
      - 'data/quarterly/**'
      - 'scripts/analysis/**'
      - 'research/longitudinal/**'
      - 'tests/**'
      - '.github/workflows/longitudinal-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test review rules and actual source corrections
        run: python3 -m unittest discover -s tests -p 'test_*longitudinal*.py' -v
      - name: Build source-reviewed coverage and comparisons
        run: python3 scripts/analysis/reviewed_longitudinal.py --output build/longitudinal
      - name: Check deterministic regeneration and unchanged inputs
        run: |
          cp -r build/longitudinal build/first
          python3 scripts/analysis/reviewed_longitudinal.py --output build/longitudinal > /dev/null
          diff -r build/first build/longitudinal
          git diff --exit-code -- data sources
      - name: Bounded public input export for independent reproduction
        run: python3 scripts/analysis/export_review_inputs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: longitudinal-review
          path: build/longitudinal
          retention-days: 14
